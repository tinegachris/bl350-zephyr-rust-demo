[package]
name = "ipc-hello-rs"
version = "0.1.0"
edition = "2021"
description = "Linux/Rust half of the BL350 Zephyr IPC demo"

# No dependencies, deliberately. The coprocessor is reached through a character
# device, so std is the whole toolkit. Adding tokio or a crate here would hide
# the one idea this demo exists to show.
[dependencies]

[profile.release]
opt-level = "z"
strip = true
