# --- OpenAMP / RPMsg ---
# Raw OpenAMP against a Linux remoteproc master. OPENAMP_MASTER stays n: Linux
# owns the vrings, this core is the remote.
CONFIG_OPENAMP=y
CONFIG_OPENAMP_MASTER=n
CONFIG_OPENAMP_RSC_TABLE=y
CONFIG_OPENAMP_RSC_TABLE_NUM_RPMSG_BUFF=8

# Mailbox used to kick the other core.
CONFIG_IPM=y

# --- Console ---
# This board's M4F console would be MCU_UART0, which Linux also enumerates and
# which no cable on this board reaches. Log to a RAM ring instead: with
# RAM_CONSOLE set, Zephyr's resource table grows an RSC_TRACE entry pointing at
# ram_console_buf, and Linux remoteproc publishes it as
# /sys/kernel/debug/remoteproc/<M4F>/trace0 -- readable while the firmware runs,
# before any vring exists, and without a serial port.
#
# It is a plain ring: newest wins, no timestamps, gone at reset.
CONFIG_LOG=y
CONFIG_LOG_MODE_MINIMAL=y
CONFIG_LOG_DEFAULT_LEVEL=4
CONFIG_CONSOLE=y
CONFIG_RAM_CONSOLE=y
CONFIG_RAM_CONSOLE_BUFFER_SIZE=4096
CONFIG_UART_CONSOLE=n
CONFIG_BOOT_BANNER=n

# Nothing here writes a UART, but this cannot be left out. The AM62x M4 SoC
# definition unconditionally turns on a NS16550 driver option that depends on
# CONFIG_SERIAL, and Kconfig aborts when something it was told to select has
# unmet dependencies:
#
#   warning: UART_NS16550_ACCESS_WORD_ONLY ... has direct dependencies
#   UART_NS16550 && SERIAL with value n, but is currently being y-selected
#   error: Aborting due to Kconfig warnings
CONFIG_SERIAL=y

CONFIG_FPU=y
CONFIG_FPU_SHARING=y

# --- Memory ---
# OpenAMP allocates the virtio device, the vrings and the rpmsg endpoint from
# the kernel heap. HEAP_MEM_POOL_SIZE defaults to 0, and with no heap
# rproc_virtio_create_vdev() simply returns NULL and the link never comes up.
CONFIG_HEAP_MEM_POOL_SIZE=16384
CONFIG_MAIN_STACK_SIZE=4096
