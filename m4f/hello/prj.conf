# No serial console reaches this board's M4F, so "hello world" goes to a RAM
# ring that Linux publishes at /sys/kernel/debug/remoteproc/<M4F>/trace0.
# The resource table that makes that ring visible comes from OPENAMP_RSC_TABLE.
CONFIG_OPENAMP=y
CONFIG_OPENAMP_MASTER=n
CONFIG_OPENAMP_RSC_TABLE=y

CONFIG_LOG=y
CONFIG_LOG_MODE_MINIMAL=y
CONFIG_LOG_DEFAULT_LEVEL=4
CONFIG_CONSOLE=y
CONFIG_RAM_CONSOLE=y
CONFIG_RAM_CONSOLE_BUFFER_SIZE=2048
CONFIG_UART_CONSOLE=n
CONFIG_BOOT_BANNER=n

# Nothing here writes a UART, but Kconfig aborts without it: the AM62x M4 SoC
# definition unconditionally selects a NS16550 option that depends on
# CONFIG_SERIAL. See m4f/ipc-hello/prj.conf for the exact error.
CONFIG_SERIAL=y
